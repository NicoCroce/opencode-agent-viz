<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Workspace móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#070B10}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #070B10; color: #E6F1F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #16222C; background: #090E14">
    <button type="button" aria-label="Volver a sesiones" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: #9AAAB6">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">refactor-auth-flow</span>
      <span style="display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #22D3EE">
        <span style="width: 5px; height: 5px; border-radius: 3px; background: #22D3EE; box-shadow: 0 0 6px #22D3EE"></span>EN CURSO · 4 AGENTES
      </span>
    </div>
    <button type="button" aria-label="Eficiencia" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid #1C2A35; border-radius: 10px; color: #67E8F9">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 13h6l-1 8 8-10h-6l1-8z"></path></svg>
    </button>
  </header>

  <div style="flex: 1; min-height: 0; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <dl style="margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #16222C; border-radius: 10px; background: #0A1016">
      <div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
        <dt style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #7A8B97">COSTO</dt>
        <dd style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 15px">$0.84</dd>
      </div>
      <div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; border-left: 1px solid #16222C">
        <dt style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #7A8B97">TOKENS</dt>
        <dd style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 15px">412k</dd>
      </div>
      <div style="padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; border-left: 1px solid #16222C">
        <dt style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: #7A8B97">TIEMPO</dt>
        <dd style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 15px">6m 12s</dd>
      </div>
    </dl>

    <div role="status" style="display: flex; flex-direction: column; gap: 12px; padding: 14px; border: 1px solid #5A4316; background: #15110A; border-radius: 12px">
      <span style="font-size: 14px; color: #F3E3C2; line-height: 1.45"><strong style="font-weight: 600; color: #F5B544">reviewer</strong> pide permiso para ejecutar <code style="font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 1px 6px; background: #221A0D; border-radius: 4px">pnpm test --run</code></span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="height: 44px; background: transparent; border: 1px solid #5A4316; border-radius: 9px; color: #F3E3C2; font-size: 14px">Rechazar</button>
        <button type="button" style="height: 44px; background: #F5B544; border: 1px solid #F5B544; border-radius: 9px; color: #1A1204; font-size: 14px; font-weight: 600">Permitir</button>
      </div>
    </div>

    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #9AAAB6; padding-top: 4px">AGENTES</span>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{agents}}" as="a" hint-placeholder-count="5">
        <button type="button" style="display: flex; align-items: stretch; gap: 12px; width: 100%; box-sizing: border-box; padding: 12px; text-align: left; background: {{a.bg}}; border: 1px {{a.borderStyle}} {{a.border}}; border-radius: 10px; color: #E6F1F5">
          <span style="width: {{a.indent}}; flex-shrink: 0; display: flex; justify-content: flex-end">
            <span style="width: 2px; border-radius: 1px; background: {{a.color}}"></span>
          </span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
            <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
              <span style="font-size: 14px; font-weight: 500">{{a.name}}</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: {{a.color}}">{{a.status}}</span>
            </span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9AAAB6">{{a.meta}}</span>
          </span>
        </button>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Secciones del workspace" style="flex-shrink: 0; height: 72px; box-sizing: border-box; padding: 8px 12px 14px; border-top: 1px solid #16222C; background: #090E14; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
    <button type="button" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #0F1C24; border: 1px solid #16404A; border-radius: 10px; color: #67E8F9; font-size: 11px; font-weight: 500">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="2.5"></circle><circle cx="5" cy="19" r="2.5"></circle><circle cx="19" cy="19" r="2.5"></circle><path d="M12 7.5v4M12 11.5L6 17M12 11.5l6 5.5"></path></svg>
      Grafo
    </button>
    <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: 1px solid transparent; border-radius: 10px; color: #9AAAB6; font-size: 11px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"></path></svg>
      Detalle
    </button>
    <button type="button" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: 1px solid transparent; border-radius: 10px; color: #9AAAB6; font-size: 11px">
      <span style="position: absolute; top: 6px; right: 30px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #F5B544; color: #1A1204; font-family: 'JetBrains Mono', monospace; font-size: 10px; display: flex; align-items: center; justify-content: center">1</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>
      Chat
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const base = { bg: '#0B1218', border: '#16222C', borderStyle: 'solid' };
    const agents = [
      { ...base, name: 'orquestador', status: 'ESPERANDO', color: '#A5F3FC', meta: 'sddorch · 184k tok · $0.41', indent: '2px' },
      { ...base, name: 'explore · recon', status: 'LISTO', color: '#9AAAB6', meta: 'explore · 52k tok · $0.04', indent: '16px' },
      { name: 'tester · specs', status: 'ACTIVO', color: '#22D3EE', meta: 'tester · 136k tok · $0.27', indent: '16px', bg: '#0E1A21', border: '#22D3EE', borderStyle: 'solid' },
      { ...base, name: 'fixtures', status: 'EN COLA', color: '#7A8B97', meta: 'general · en espera', indent: '30px', borderStyle: 'dashed', border: '#23343F', bg: 'transparent' },
      { name: 'reviewer', status: 'PERMISO', color: '#F5B544', meta: 'reviewer · 40k tok · $0.12', indent: '16px', bg: '#120F0A', border: '#F5B544', borderStyle: 'dashed' }
    ];
    return { agents };
  }
}
</script>
</body>
</html>
